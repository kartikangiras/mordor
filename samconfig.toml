version = 0.1

[default.global.parameters]
stack_name = "mordor-dev"
region = "us-east-1"

[default.build.parameters]
use_container = true
template_file = "infra/template.yaml"

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
resolve_image_repos = true   # ECR repos for the five container-image forecast functions
parameter_overrides = "AppName=mordor Stage=dev DemoAuth=0"   # demo personas are real Cognito users (AWS_INTEGRATION.md row 13); DemoAuth is for local-style stacks only

[prod.deploy.parameters]
stack_name = "mordor-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
resolve_image_repos = true
parameter_overrides = "AppName=mordor Stage=prod"
